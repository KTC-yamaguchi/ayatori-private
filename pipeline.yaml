      readers: ["scripts/check-marker-retention.mjs (--snapshots reverse-verify/snapshots/{run_id})"]
      note: |
        訂正前の複製 ({stem}.snapshot.md)。推測マーカー保持検査の基準線。
        - 直下 = 要件文書を **全量** 退避する。判定は退避物を母集団に回るため、訂正対象だけを置くと
          「触っていない文書のマーカーが落ちていないか」という検査本来の目的が成立しない
          (skills/31-req-change-detect も同じ理由で全量退避を指示)。
        - screens/ サブディレクトリ = 画面仕様。**直下に置いてはならない** — 要件文書の判定は
