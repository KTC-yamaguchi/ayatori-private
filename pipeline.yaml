      when: "21g 実行時 (render 失敗時は不在 — fail-open で link-only degrade)"
      primary_writer: 21g-graphic-embed-review   # scripts/render-embed-review.mjs による決定的生成 (手焼き禁止、graphic-recommend.html と同型)
      readers: []                       # 人間ゲート閲覧用 (human_gate.artifact_preview.step_targets が auto-open)
      note: "埋め込み済みグラフィックを該当画面プレビュー (iframe srcdoc) 上でハイライト表示する視覚レポート (POCTEAMA-190 — Jira 設計観点「どのグラフィックがどの箇所に入ったかが分かるレビュー画面」)。毎回丸ごと再生成。schema なし (派生 HTML)。"
    - path: graphics/samples/          # テイスト A/B/C サンプル (ILLUSTRATIVE)
      role: graphic_taste_samples
      when: "21c 実行時"
      primary_writer: 21c-graphic-taste
      readers: []                       # 人間ゲート閲覧用
    - path: graphics/raw/               # {graphic_id}.png 生成直後の中間物 + generation-manifest.json (監査台帳)
      role: graphic_intermediate
      when: "21e 実行時"
      primary_writer: 21e-graphic-generate
      readers: [21f-graphic-postprocess]
      note: "PNG は確定 size_px ちょうどの寸法で置かれる (21e がサイズ自動調整済み)。generation-manifest.json は実使用モデル / API サイズ / resize 有無の補助記録で、resume・埋め込み対象の SoT は pipeline-state.screens.graphics.generated_files[] (設計 §9-2b)。21f 正典化後も中間物として残置 (監査 + retry 差分の基準、READ-ONLY)。"
    - path: graphics/postprocess-manifest.json
      role: graphic_postprocess_ledger   # 後処理の監査台帳 (補助記録)
      when: "21f 実行時"
      primary_writer: 21f-graphic-postprocess
      readers: [21g-graphic-embed-review]
      note: "slot 別の透過検証 verdict (verified/waived/n/a + alpha 統計) / degrade ラベル。補助記録 — resume・埋め込み対象の SoT は pipeline-state 側 (設計 §9-2b)。21g は transparency='waived' ラベルを配置判断 (重ね置き回避) に使う。"
    - path: screens/_shared/graphics/   # {graphic_id}.png
      role: graphic_canonical           # 第 4 の正典系統 (root-variables / components / illustrations に続く)
      when: "21f 完了時"
      primary_writer: "21f-graphic-postprocess (29 は additive のみ・既存改変禁止)"
      readers: [21g-graphic-embed-review, 29-partial-screen-regen]
      note: "HTML から <img src> で相対参照される正典実体 (設計 §7)。raw PNG のバイト無加工コピー (圧縮 ⑫ は非搭載 — ユーザー判断でスコープ除外。C-26 / schema pattern は将来拡張として webp も許容)。実ファイル名の SoT は pipeline-state.screens.graphics.generated_files[].file。25b (inherit_main) は main HTML のタグごと継承しファイルは読まない。"

# ── Skip Phases ─────────────────────────────────
# Add phase names to skip them during execution.
# Valid values: question, requirements, req_delta, design, screens, retro, add_feature, delta, delta_mini, export  (= pipeline.yaml の phase_order と同順)
# 追加で指定可 (phase_order 非搭載の standalone): idea_brushup, reverse_verify
# Typical use: skip the entire requirements or screens phase in non-production environments.
# Example: skip_phases: [requirements, screens]
skip_phases: []

# ── Command Policy ──────────────────────────────
# SoT for which slash commands are legitimate during a pipeline run.
# pipeline.yaml は従来 phase/step のみを宣言し、許容コマンドを宣言していなかったため、
# 本流に未登録の外部コマンドが誤操作で混入しても検知できなかった。
# 受信時の手順・停止挙動は CLAUDE.md Operating Principle 5 (外部コマンド混入の検知) を参照。
#
# 値の形式 (重要): allowed_commands / external_command_prefixes はいずれも先頭 `/` を
# 含まない名前で列挙する (例: `ayatori-question` / `kairo-`)。slash command 本体は
# `/` + 値 で表記する (例: `/ayatori-question`)。受信コマンドの照合時は先頭 `/` を除去して
# から allowed_commands と完全一致 / external_command_prefixes と前方一致を判定する。
command_policy:
  # repo-scoped な正規コマンド (= 各 phases/*/SKILL.md frontmatter `name:`、先頭 `/` 無し)。
  # 注: ayatori-status は dashboard で phase_order/phase ブロックを持たない。
  #     ayatori-reverse は alternative entry point で phase_order に含まれない。いずれも正規コマンド。
  #     ayatori-reverse-verify は reverse 完了後の対象限定突合 (Phase 0c、phase_order 非搭載の反復実行コマンド)。
  #     ayatori-idea は /ayatori-question 前段の独立コマンド (cm-consult 型、phase_order 非搭載)。
  allowed_commands:
    - ayatori-status
    - ayatori-reverse
    - ayatori-reverse-verify
    - ayatori-idea
    - ayatori-question
    - ayatori-requirements
    - ayatori-req-delta
    - ayatori-add-feature
    - ayatori-design
    - ayatori-screens
    - ayatori-retro
    - ayatori-delta
    - ayatori-delta-mini
    - ayatori-export
    - ayatori-cm-consult
    - ayatori-index
    - ayatori-train
  # 既知の外部コマンド prefix (検知ヒント、網羅ではない)。
  external_command_prefixes: [kairo-, rev-, tdd-, direct-]
  # 未登録コマンド受信時の挙動: halt_and_confirm | warn | allow
  on_unrecognized_command: halt_and_confirm
  # パイプラインの唯一の正規出力ルート。外部コマンドがこれを逸脱する別ツリー
  # (例: docs/design/{app_name}/) に出力しようとしたら衝突として停止する。
  output_root: artifacts/{app_name}/

# ── Reverse Handoff ─────────────────────────────
# Declares what Phase 0b produces and which downstream steps can skip
# re-deriving that content. Consumed by phases/design and phases/screens preambles.
# To add a new skip rule: add an entry under skip_rules and update the relevant sub-skill.
reverse_handoff:
  artifacts:
    - path: tokens.json
      produced_by: 06-format-convert
      consumed_by: design
      note: "Base palette; Step 08 uses as starting point instead of deriving from scratch"
    - path: screens/00-screen-list.md
      produced_by: 06-format-convert
      consumed_by: screens
      note: "Screen list already derived; Step 14 skips re-derivation"
    - path: requirements/
      produced_by: 03-requirements-gen
      consumed_by: screens
      note: "ISO 29148 docs ready for Step 15 Confluence upload"
    # ── E6 (Step 06) の遷移図 4 点セット ──
    # requirements/03-user-flow.md の Mermaid から scripts/derive-transition-map.mjs で決定論変換した
    # SSoT + 生成時 summary の sidecar + 派生 2 ファイル。E6-2 が exit 2 で fail-open した run
    # (user-flow に Mermaid が無い / エッジ 0 本 / screen-list 不在 等) では 4 ファイルとも不在があり得る
    # — 下流は「有る」前提で素通りせず、不在なら Step 14 / 14-lite が salvage する (skip ではなく補完)。
    - path: screens/00-transition-map.mmd
      produced_by: 06-format-convert   # E6-2
      consumed_by: screens
      note: "Transition diagram SSoT derived from requirements/03-user-flow.md; Step 14 / 14-lite reuses it as-is and never regenerates (may be absent if E6-2 failed open)"
    - path: screens/00-transition-map.derive-summary.json
      produced_by: 06-format-convert   # E6-2 (script が .mmd と併記する sidecar)
      consumed_by: screens
      note: "Generation-time summary (warnings[] + mmd_md5) written alongside the .mmd; the ONLY source of unparsed_line / dropped-edge warnings for the Step 16 gate when Phase 3 keeps the existing .mmd"
    - path: screens/00-screen-nav.json
      produced_by: 06-format-convert   # E6-3
      consumed_by: screens
      note: "Per-screen in/out derived view (scripts/derive-screen-nav.mjs); regenerable downstream (may be absent if E6-2 failed open)"
    - path: screens/00-coverage-check.json
      produced_by: 06-format-convert   # E6-4
      consumed_by: screens
      note: "L1〜L4 empty stub + user_accepted_gaps: true (早期チェック未実施の印) + L5 connectivity patched by scripts/validate-connectivity.mjs --write (may be absent if E6-2 failed open)"

  skip_rules:
    design:
      step: 08-design-brainstorm
      skip: discovery_hearing
      use_instead: "derive 3 design directions directly from requirements.json; use tokens.json as palette base (Proposal A starting colors)"
    screens:
      step: 14-screen-list-transition
      skip: screen_list_derivation
      use_instead: "existing screens/00-screen-list.md from Phase 0b"

# ── Global Constraints ───────────────────────────
# Active technical constraints that apply to all projects.
# Each phase preamble should reference these before executing steps.
# Add new entries here after the retro phase approves them.
constraints:
  # ── Figma / Plugin API ──
  - id: C-01
    applies_to: [17-screen-gen]
    rule: "primaryAxisSizingMode / counterAxisSizingMode に 'HUG' 禁止 → 'AUTO' を使用"
  - id: C-02
    applies_to: [17-screen-gen]
    rule: "layoutSizingHorizontal/Vertical = 'FILL' は parent.appendChild(node) の後のみ設定可"
  - id: C-03
    applies_to: [17-screen-gen]
    rule: "auto-layout 必須。手動 y 座標積み上げ禁止（クリッピングが発生）"
  - id: C-04
    applies_to: [17-screen-gen]
    rule: "全 use_figma コール冒頭で figma.setCurrentPageAsync(ayatoriPage) 必須（前回プロジェクトのページがデフォルトのため）"
  - id: C-05
    applies_to: [17-screen-gen]
    rule: "async function main() {} main() パターン禁止 → トップレベルawait必須（Plugin API は Promise を待機しない）"
  - id: C-06
    applies_to: [17-screen-gen]
    rule: "SectionNode に resize() / resizeToFit() なし → children.reduce() で高さを手動計算"
  - id: C-07
    applies_to: [17-screen-gen]
    rule: "progress bar は layoutMode='HORIZONTAL' + 2セグメント構成。layoutPositioning='ABSOLUTE' を layoutMode='NONE' 親に使用禁止（ValidationError）"
  - id: C-08
    applies_to: [25-component-build]
    rule: "Variable binding (bv() / setBoundVariableForPaint) 実行後は get_screenshot で amber/orange 検出チェック。検出時は hardcoded hex に fallback"
  - id: C-09
    applies_to: [25-component-build]
    rule: "ウィザード進行インジケーターは bv() を使わず hardcoded hex (color.primary値) で実装"
  # ── HTML 実装 ──
  - id: C-10
    applies_to: [17-screen-gen]
    rule: "ダイアログは .overlay { position:absolute; inset:0; display:flex } パターン。body への直接 flex centering 禁止"
  - id: C-11
    applies_to: [17-screen-gen]
    rule: "リスト画面モックデータは利用可能高さを埋める件数設定（コンテンツ領域の高さ ÷ 1アイテム高さ 以上）"
  - id: C-12
    applies_to: [17-screen-gen]
    rule: "再キャプチャ時は URL に ?v=N クエリパラメータ追加（ブラウザキャッシュ回避）"
  # ── フォント ──
  - id: C-13
    applies_to: [17-screen-gen]
    rule: "全テキストノードのフォントサイズ最小値: 12px。生成後に findAll(n=>n.type==='TEXT'&&n.fontSize<12) で一括検証・修正"
  - id: C-14
    applies_to: [17-screen-gen]
    rule: "Space Grotesk は Bold/Medium/Regular/Light のみ（SemiBold は Figma に存在しない）"
  # ── 状態フレーム ──
  - id: C-15
    applies_to: [17-screen-gen]
    rule: "状態フレーム命名: 非同期処理画面は {画面名}_Success/{画面名}_Error、詳細系削除は {画面名}_DeleteDialog。基本フレームと同一 use_figma コール内で生成"
  - id: C-16
    applies_to: [17-screen-gen]
    rule: "必須 annotation frames: WCAG_2.4.7_FocusRing_Annotation + API呼び出し画面の loading state フレームを⑫完了前に生成"
  # ── Figma ページ構成 ──
  - id: C-17
    applies_to: [17-screen-gen, 24-design-system-update]
    rule: "デザインシステム・モバイル・デスクトップ画面は全て {app_name} ページに統合。プロジェクトごとに専用ページを作成。デザインシステムが前回と同一なら既存セクションを再利用"
  # ── 生成前チェック ──
  - id: C-18
    applies_to: [17-screen-gen]
    rule: "生成前カラー整合チェック: design-brief.yaml の primary カラーと既存 screens/**/*.html (web/, mobile/ 配下を再帰) を照合し、不一致なら全HTML一括更新を先行してから Figma 生成へ進む"
  # ── Figma Plugin API 列挙値 ──
  - id: C-21
    applies_to: [24-design-system-update, 25-component-build]
    rule: "counterAxisAlignItems 有効値: 'MIN' | 'MAX' | 'CENTER' | 'BASELINE' のみ。'STRETCH' は無効（ValidationError）"
  - id: C-22
    applies_to: [24-design-system-update, 25-component-build]
    rule: "primaryAxisAlignItems 有効値: 'MIN' | 'MAX' | 'CENTER' | 'SPACE_BETWEEN' のみ。'STRETCH' は無効（ValidationError）"
  - id: C-23
    applies_to: [24-design-system-update, 25-component-build]
    rule: "Variable collection / Component page 生成前に既存チェック必須: figma.variables.getLocalVariableCollections() で重複を検出し、存在する場合は create せず update または skip"
  # ── 要件定義 ──
  - id: C-19
    applies_to: [02-iso-breakdown]
    rule: "コンテンツ消費系機能の「完了ボタン有効化条件」（常時/スクロール後/視聴時間後）を Unambiguity チェックで確認"
  - id: C-20
    applies_to: [02-iso-breakdown]
    rule: "Expo/React Native 使用時はネイティブ機能ライブラリの managed workflow 互換性を Feasibility チェックで確認"

  # ── 共通部品 (chrome) ──
  - id: C-24
    applies_to: [14-screen-list-transition, 16-design-doc-human-review, 17-screen-gen]
    rule: "共通部品 (ボトムメニュー 1 種 + ヘッダー 2 種 A/B) は Step 14 で chrome プランを 1 度決め (00-screen-list.md)、Step 17 Phase 0b で _shared/components.html + components.css に正典化し、各画面へ verbatim ペースト + スロット (現在タブ / タイトル / 戻り先) のみ差し込む。画面ごとの chrome 再発明・ランタイム JS 注入は禁止。生成後 chrome 一貫性 self-check (byte 一致) を行い不一致は Pattern B で abort。docs/html-generation-rules.md §11 参照"

  # ── 画面 content の色トークン強制 ──
  - id: C-25
    applies_to: [17-screen-gen, 18-design-review, 19-rubric-score, 21-screen-human-review, 24-design-system-update, 29-partial-screen-regen, 25b-state-pattern-gen, 25c-state-pattern-score]
    rule: "画面 content は zero-literal — 色リテラル (hex / rgb() / hsl() / CSS 色名、SVG fill=/stroke=/stop-color= 属性と var() fallback 含む) を書かない。定義済み token と同じ値でも禁止。色は var(--token) / currentColor のみ (:root 系定義ブロック・raster img・プレビュー足場定数の完全一致値は除外)。アイコンは icons/{name}.svg を Step 0 で currentColor 正規化 (--normalize-icons) の上 verbatim 埋め込み (識別は形状署名 — data 属性は付けない)。繰り返しイラストは _shared/illustrations/{name}.svg 正典を逐語ペースト (docs/html-generation-rules.md §11.7。pictogram では休止 = 生成されない)。各画面の :root は _shared/root-variables.css の全変数名を含む (使う分だけの間引き禁止 = root_vars_incomplete、画面固有の追加変数は superset 許容 — P-15 丸ごと inline copy の機械強制、inherit_main の前提)。検証 = scripts/lint-screen-colors.mjs: 生成後の --check は exit 1 (hard 違反) でリトライ≤3 → Pattern B (17/29 は abort、25b は当該 file pending 残し)。未解決 --color-illustration-* (昇格候補) と派生ファイル (sub-state) の root_vars_incomplete (main 由来・当該ファイル修正不能 = soft_inherited) は soft = exit 0 で続行し、--report (color-lint-report.json) 経由で 19 機械減点 (summary 数値のみ・SoT は skill 19) / 21 Section 1-D・25d 人間判断 (台帳外 :root 色変数 extra_root_vars 含む) / 24 Step A-2b 昇格 (実体化は次回生成 run)。C-18 とは役割分担 — C-18 は生成前の primary 1 色整合、C-25 は生成後の全色 lint"

  # ── AI 生成グラフィックの埋め込み形式 (挿入位置設計 docs/graphic-generation-design.md §7) ──
  - id: C-26
    applies_to: [21g-graphic-embed-review, 29-partial-screen-regen]
    rule: "AI 生成グラフィックは <img src='../_shared/graphics/{graphic_id}.(png|webp)' alt='{graphic_id}' width height> の正典相対参照で埋め込む (設計 §7)。Base64 data URI インラインは使わない (LLM context 保護)。alt 必須 (Figma レイヤ名)・width/height 明示必須。CSS background-image は装飾背景のみ可。SVG 形式のグラフィックは禁止 (ラスターのみ)。object-fit は cover(→FILL)/contain(→FIT) のみ使用。"

  # ── Operating Principle 4 ──
  # CLAUDE.md Operating Principle 4 (5 分類タクソノミー) の machine-readable enforcement spec。
  # 検出は keyword grep ではなく LLM self-reflection (skill が docs/principle4-disambiguation.md
  # の 4-step を Write 直前に実行)。固定 keyword リストは撤去 (hardcode 管理コスト + 列挙漏れ + 誤 hit)。
  # enforcement は schema 構造検証 (P4-06、.claude/hooks/schema-light-check.sh) が補完する。
  # applies_to の "all" は全 skill / agent に適用 (subagent も含む)。
  # disambiguation self-check を wire-in する対象 step (二重防御):
  #   input 受領 = 01-question / 08-design-brainstorm / 31-req-change-detect / 27-change-detect / 00-feedback-protocol
  #   要件昇華 = 02-iso-breakdown / 03-requirements-gen (機能追加の根拠 gap-check、P4-02 / Rule 1)
  #   AI 生成 backup = 14-screen-list-transition / 17-screen-gen / 19-rubric-score
  # 詳細索引は docs/principle4-disambiguation.md §3。
  - id: P4-01
    applies_to: [all]
    rule: "確定していない情報を user input 以外で AI が確定生成しない。判定は Write 直前に解釈候補を文字で書き出し、書き出した候補が N≥2 なら (D) UNCERTAIN とする (候補を炙り出すのは LLM self-reflection だが判定は候補数で機械的に行う — 内部感覚『悩んだか』はトリガーにしない＝検証不可・実行ごとに揺れる / 固定 keyword リストには依存しない)。曖昧さは 3 種 (semantic 複数解釈 / softening 確信度低 / enumeration 開いた列挙) にラベル付け。検出時は ※不明 / ※推測 / [example] / [proposal] のマーカー併記、または artifacts/{app_name}/pending-questions.json への append が必須。直接 AskUserQuestion せず Pre-flight Gate で batch propose。input 受領 step は input 解釈、AI 生成 step は『書く値に CONFIRMED/DERIVED 根拠があるか』の gap-check。4-step 手順は docs/principle4-disambiguation.md (CLAUDE.md Principle 4 Rule 4)"
  - id: P4-02
    applies_to: [01-question, 02-iso-breakdown, 03-requirements-gen]
    rule: "要件にない機能カテゴリの能動追加禁止。must / should / could いずれの粒度でも適用 (CLAUDE.md Rule 3 を一般化)"
  - id: P4-03
    applies_to: [08-design-brainstorm, 17-screen-gen]
    rule: "視覚要素の補完は (A) CONFIRMED → (C) DERIVED ルートのみ。palette / typography / spacing の AI 単独決定禁止 (CLAUDE.md Rule 2)。注: 11-wcag-mapping は WCAG 2.2 基準を決定的に適用する step で視覚要素を新規補完しないため対象外 (over-claim 解消のため旧 applies_to から除外)"
  - id: P4-04
    applies_to: [09-sample-html-gen, 02-iso-breakdown, 07-human-gate-req, 29-partial-screen-regen, 29b-reverse-propagate, 03-requirements-gen, 05-review-gate, 02-source-analysis]
    rule: "subagent contract: 生成 / 監査 subagent は判定を return し、main session が単一 writer として artifact に append する (resolve は main のみ)。(a) Step 09 = ayatori-sample-html-builder が design-brief.yaml の palette placeholder hex 等の未確定値を検出した場合 assertion_failed: pending_question を return (orchestrator が main 経由で pending-questions.json に append、出力は全体 (E) PROPOSED + 内部 placeholder (B) ILLUSTRATIVE の入れ子分類)。(b) requirements 層 self-bias 対策 (F-3): 02-iso-breakdown が generation-provenance.json に load-bearing specifics を forced-enum 自己申告 (F-3a、スキップの自由を奪う)、07-human-gate-req が ayatori-requirements-auditor subagent (layer=requirements、生成 context 隔離) を起動し provenance を user 確定 input への literal トレースで再判定して requirement-deviations.json に append する (F-3b、生成↔監査が同一 model の self-bias を構造分離で catch)。(c) delta 層 self-bias 対策 (F-3b 拡張): 29-partial-screen-regen が ayatori-requirements-auditor subagent (layer=delta、突合先=変更後 requirements.json) を起動し、再生成画面の component+挙動を独立監査して requirement-deviations.json に append する (delta は再生成↔監査が同一 session のため隔離必須。provenance 台帳は無く F-3b のみ適用)。(d) reverse 層 self-bias 対策: 03-requirements-gen が reverse-provenance.json に load-bearing specifics を forced-enum 自己申告し source_backed/derived に input-sources/{stack}/path:line の source_ref を必須化 (F-3a 相当)、05-review-gate が ayatori-requirements-auditor subagent (layer=reverse、突合先=input-sources 実コード file:line) を起動し推測を再判定して requirement-deviations.json (phase=reverse) に append する (F-3b 相当、Step 03 生成↔監査が同一 model の self-bias を構造分離で catch)。(e) delta 層の逆方向 (screen-edit): 29b-reverse-propagate が ayatori-requirements-auditor subagent (layer=delta、audit_direction=reverse、突合先=requirements/*.md) を起動し、手編集 diff が触れた要素のみを独立監査して requirement-deviations.json (要件外追加 / 要件矛盾 / 要件削除 + promotion_target) に append する (編集が導入していない既存ギャップは監査対象外)。「要件に昇格」の resolve は 29c-req-propagate が requirements/*.md 反映後に resolved_at を stamp する。(f) reverse 層の解析 pass: 02-source-analysis の pass subagent (B1 文書 / B2 module shard / B3 figma) は引用文法つき構造化 findings のみ return し、raw-analysis.md の write・Cross-Source Conflicts の採否・AskUserQuestion (B-03/B-06) は main が単一 writer として行う (B2 shard は専用 worker ayatori-code-analysis-worker [Read/Bash/Glob のみ・Write なし] が .code-inventory.json の読み取り計画に従い構造+挙動を 1 回読みで実行)。E2E で dead と確認された design-brief.yaml.uncertainty.entries[] 読取り経路は Chunk 2 で撤去済"
  - id: P4-05
    applies_to: [all]
    rule: "(D) UNCERTAIN を検出 → artifacts/{app_name}/pending-questions.json に append (**未解決 entry の append 時のみ** 反映先 artifact を `reflect_to` で宣言する — appender は検出時点で反映先ファイルを持っている。**born-resolved entry [resolved_at + resolved_answer を同時に書く確定記録] には書かない** = 振り分け script は resolved を読む前に抜けるため値が使われる経路が無い。**書ける値は「いずれかの phase の target_artifacts が受け付ける pattern」に限り、かつ自分より後に通る門が受け手であること** — 受け手が上流だけの値を書くと正順の進行で二度と ask されない [その場合は反映先 phase へ user を戻す resume 指示を併記する / 反映先が定まらないものとして未設定にする の 2 択]。許容値リストと 2 択の判断基準の SoT は `skills/_shared/preflight-gate.md` § append 経路)。次 Phase 入口で main session が batch propose (propose-then-confirm パターン、Anthropic 公式 best practice)。ただし **ask するのは反映先が当該 phase の target_artifacts に解決できる entry のみ** — 振り分けは決定論 script `scripts/preflight-partition.mjs` が行い、解決できない entry は ask せず未解決のまま次の門へ持ち越す (反映先の無い phase で答えを消費すると確定値が本来の受け皿に届かない = E2E 実測。`reflect_to` 未設定の legacy entry は従来どおり全件 ask)。subagent は append のみ可、resolve は main session のみ (公式 doc: AskUserQuestion is not available to subagents)"
  - id: P4-06
    applies_to: [all]
    rule: "schema required field の欠落 / null / 空文字 / placeholder 値 = (D) UNCERTAIN。補完せず ask。.claude/hooks/schema-light-check.sh が jq で pending-questions.json (R3 必須 field / R5b target dot-bracket 文法) と requirement-deviations.json (R6 必須 field + resolved 整合) と generation-provenance.json (R7 specifics 必須 field + provenance enum + derived→derived_from 整合 + ref 文法) と reverse-provenance.json (R8 specifics 必須 field + provenance enum + source_backed→source_ref(file:line) / derived→derived_from 整合 + ref 文法) の構造を検証。E2E で dead と確認された uncertainty.entries[] 検証 (旧 R1/R2/R4/R5) は Chunk 2 で撤去済"
  - id: P4-07
    applies_to: [all]
    rule: "同一 field を同一 session 内で 2 回以上 ask しない (CLAUDE.md Rule 6、Constitution 過剰質問アンチパターン対策)。pending-questions.json の target literal で dedupe、resolved_at が set されたものは next session まで保持 (Pattern D 集計用)"

