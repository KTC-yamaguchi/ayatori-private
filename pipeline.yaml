        PreToolUse hook の _backup/ 退避 (artifact_backup) とは役割が別。
        - **退避先は run_id でディレクトリを分ける**。判定は今ディスクにある退避物を基準線にするため、
          run を跨いで共有すると 2 回目の run が 1 回目の訂正前内容と比較し、承認済みの訂正を
          violation として上げる (FAIL の処方は「退避物から戻す」なので従うと訂正が巻き戻る)。
          パスに run_id が入れば「再開なら既存を使う / 新 run なら新しい基準線」が機械的に決まる。
        - 当該 run の退避物が既にあれば作り直さない (訂正後の内容で上書きすると baseline == current に
          なり、以降の検査は必ず PASS = 無意味化する)。
        検査は --docs で訂正した文書集合を明示して実行する (省略すると req_delta.runs 由来の導出に
        落ちて、本 phase の正当な訂正が FAIL と誤判定される)。
