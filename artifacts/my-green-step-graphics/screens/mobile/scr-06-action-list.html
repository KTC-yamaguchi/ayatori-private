<title>MyGreenStep — アクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* ---- color (semantic layer) ---- */
  --color-primary: #117F87;
  --color-primary-hover: #0E6B72;
  --color-primary-active: #0A5A60;
  --color-on-primary: #FAFAFA;
  --color-surface: #FFFFFF;
  --color-surface-variant: #F8FAFA;
  --color-on-surface: #0C0C0C;
  --color-on-surface-secondary: #6B6B6B;
  --color-border-default: #E8E8E8;
  --color-border-brand: #A0CCCF;
  --color-success: #2E7D32;
  --color-success-bg: #E8F5E9;
  --color-error: #D32F2F;
  --color-error-bg: #FFEBEE;
  --color-warning: #F57F17;
  --color-warning-bg: #FFF8E1;
  --color-warning-text: #7A4100;
  --color-warning-toast-bg: #FFF3E0;
  --color-info: #0277BD;
  --color-info-bg: #E1F5FE;
  --color-destructive: #D32F2F;
  --color-destructive-hover: #B71C1C;
  --color-secondary-active-bg: #E0F2F1;
  --color-disabled: #BDBDBD;
  --color-focus-ring: #117F87;
  --color-chart-accent: #4DB6AC;
  --color-baseline-gray: #E0E0E0;
  --color-shadow-sm: rgba(0,0,0,0.04);
  --color-shadow-md: rgba(0,0,0,0.12);
  --color-error-text: #B71C1C;
  --color-error-border: #D32F2F;
  --color-info-text: #0277BD;
  --color-info-border: #0277BD;
  --color-warning-border: #F57F17;
  --color-success-text: #2E7D32;
  --color-success-border: #A5D6A7;
  --color-on-primary-container: #0E6B72;
  /* ---- font family ---- */
  --font-display: Poppins, sans-serif;
  --font-base: -apple-system, 'SF Pro', 'Helvetica Neue', sans-serif;
  --font-numeric: 'SF Mono', 'DM Mono', 'JetBrains Mono', monospace;
  --font-variant-numeric: tabular-nums;
  /* ---- font size ---- */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-md: 17px;
  --fs-lg: 20px;
  --fs-xl: 24px;
  --fs-2xl: 28px;
  --fs-3xl: 42px;
  /* ---- line height ---- */
  --lh-tight: 1.1;
  --lh-base: 1.3;
  --lh-relaxed: 1.5;
  /* ---- font weight ---- */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-display: 590;
  --fw-semibold: 600;
  --fw-bold: 700;
  /* ---- spacing ---- */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-2xl: 40px;
  --sp-touch: 44px;
  /* ---- radius ---- */
  --radius-xxs: 2px;
  --radius-xs: 3px;
  --radius-sm: 8px;
  --radius-sm-plus: 10px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 32px;
  --radius-pill-sm: 100px;
  --radius-pill: 500px;
  --radius-circle: 50%;
  /* ---- border width ---- */
  --bw-thin: 1px;
  --bw-medium: 2px;
  /* ---- shadow (色は --color-shadow-* を参照) ---- */
  --shadow-xs: 0 1px 2px var(--color-shadow-sm);
  --shadow-sm: 0 1px 3px var(--color-shadow-sm);
  --shadow-md: 0 4px 16px var(--color-shadow-md);
}

/* common-styles.css — 全画面共通スタイル（Step 17 Phase A で生成）。
   各画面 HTML へは style ブロックへ逐語インラインする（外部 CSS 参照は禁止）。
   色は var(--color-*) 参照のみ（zero-literal）。 */

/* ---- reset ---- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ---- モバイルプレビュー足場（プレビュー専用の canonical 値） ---- */
body {
  background: #E8E4DF;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  gap: 16px;
  font-family: var(--font-base);
  color: var(--color-on-surface);
  -webkit-font-smoothing: antialiased;
}
.screen {
  width: 390px;
  min-height: 844px;
  background: var(--color-surface);
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ---- フォーカスリング（WCAG 2.4.7） ---- */
a:focus-visible,
button:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: var(--bw-medium) solid var(--color-focus-ring);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

/* ---- 汎用テキストユーティリティ ---- */
.num { font-family: var(--font-numeric); font-variant-numeric: var(--font-variant-numeric); }
.muted { color: var(--color-on-surface-secondary); }

/* ---- 空状態（表現的イラストの代替 = icons/ の単一アイコン拡大） ---- */
.empty-state { display: flex; flex-direction: column; align-items: center; gap: var(--sp-md); padding: var(--sp-xl) var(--sp-md); text-align: center; }
.empty-state__icon { width: clamp(64px, 18vw, 96px); height: auto; color: var(--color-on-surface-secondary); }

/* ---- モーション配慮（WCAG 2.3.3） ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* components.css — 共通部品 (chrome) CSS の正典。Step 17 Step 0b-1 で生成。
   各画面 HTML の <style> へ逐語インラインする (@charset 行は含めない)。
   色は var(--color-*) 参照のみ。 */

/* ---- mobile header (A / B 共通) ---- */
.mobile-header {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  height: 56px;
  padding: 0 var(--sp-md);
  background: var(--color-surface);
  border-bottom: var(--bw-thin) solid var(--color-border-default);
}
.mobile-header h1 {
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-base);
  color: var(--color-on-surface);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mobile-header--sub h1 { font-size: var(--fs-md); }
.mobile-header__back {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--sp-touch);
  height: var(--sp-touch);
  margin-left: calc(var(--sp-sm) * -1);
  color: var(--color-on-surface);
  border-radius: var(--radius-sm);
}
.mobile-header__back svg { width: 24px; height: 24px; }
.mobile-header__action {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  min-width: var(--sp-xs);
  color: var(--color-primary);
  font-size: var(--fs-sm);
}

/* ---- mobile bottom nav (タブバー) ---- */
.mobile-bottom-nav {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--color-surface);
  border-top: var(--bw-thin) solid var(--color-border-default);
  padding-bottom: var(--sp-sm);
}
.mobile-bottom-nav__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  min-height: var(--sp-touch);
  padding: var(--sp-sm) var(--sp-xs) var(--sp-xs);
  text-decoration: none;
  color: var(--color-on-surface-secondary);
}
.mobile-bottom-nav__item svg { width: 24px; height: 24px; }
.mobile-bottom-nav__item span {
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
}
.mobile-bottom-nav__item[aria-current="page"] { color: var(--color-primary); }

/* ---- 画面本文の共通スクロール領域 ---- */
.screen__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--sp-md);
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  background: var(--color-surface-variant);
}

/* ---- scr-06-action-list 固有スタイル ---- */
.section { display: flex; flex-direction: column; gap: var(--sp-sm); }
.section__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sm); }
.section__title { font-family: var(--font-display); font-size: var(--fs-base); font-weight: var(--fw-semibold); color: var(--color-on-surface); }
.section__count { font-size: var(--fs-sm); color: var(--color-on-surface-secondary); }
.doing-card, .suggest-card { position: relative; overflow: hidden; min-height: 104px; display: flex; align-items: center; gap: var(--sp-md); background: var(--color-surface); border: var(--bw-thin) solid var(--color-border-default); border-radius: var(--radius-lg); padding: var(--sp-md); box-shadow: var(--shadow-xs); }
.suggest-card { text-decoration: none; }
.card-icon { flex: none; align-self: stretch; width: 120px;
  margin: calc(var(--sp-md) * -1) 0 calc(var(--sp-md) * -1) calc(var(--sp-md) * -1);
  background: var(--color-secondary-active-bg); color: var(--color-on-primary-container);
  display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
.card-icon svg { width: 24px; height: 24px; }
.card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 被写体が左寄りの 2 枚は crop 基準を左端へ (実測重心 energy 38.8% / walk 34.0% →
   可視域 0-76.9% で枠内 50.5% / 44.2% = ほぼ中央。拡大しないため画質は落ちない) */
.card-icon[data-graphic-slot="action-energy"] img,
.card-icon[data-graphic-slot="action-walk"] img { object-position: 0% 50%; }
.card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-xs); }
.card-name { font-size: var(--fs-base); font-weight: var(--fw-semibold); color: var(--color-on-surface); line-height: var(--lh-base); }
.card-meta { display: flex; align-items: center; gap: var(--sp-sm); flex-wrap: wrap; }
.card-co2 { font-family: var(--font-numeric); font-variant-numeric: var(--font-variant-numeric); font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--color-success); }
.badge { display: inline-flex; align-items: center; border-radius: var(--radius-pill); padding: var(--sp-xs) 10px; font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.badge--category { background: var(--color-secondary-active-bg); color: var(--color-on-primary-container); }
.badge--easy { background: var(--color-success-bg); color: var(--color-success-text); }
.badge--normal { background: var(--color-warning-bg); color: var(--color-warning-text); }
.card-cta { flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: var(--sp-touch); min-width: 64px; padding: 10px var(--sp-md); border: var(--bw-thin) solid var(--color-primary); border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); font-family: var(--font-base); font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer; }
.card-chevron { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--sp-touch); height: var(--sp-touch); color: var(--color-on-surface-secondary); }
.card-chevron svg { width: 20px; height: 20px; }
</style>
