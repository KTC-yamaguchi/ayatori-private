        - { name: "on-surface", hex: "#000000", oklch: { l: 0.05, c: 0, h: 0 }, usage: "本文テキスト", contrast_label: "21.00:1 AAA on surface" }
        - { name: "on-surface-variant", hex: "#2E2E2E", oklch: { l: 0.30, c: 0, h: 0 }, usage: "補足テキスト", contrast_label: "13.58:1 AA on surface" }
        - { name: "primary", hex: "#1B1B1B", oklch: { l: 0.22, c: 0, h: 0 }, usage: "CTA・フォーカス", contrast_label: "17.22:1 AAA on surface, 14.85:1 AAA on-primary" }
        - { name: "on-primary", hex: "#EEEEEE", oklch: { l: 0.95, c: 0, h: 0 }, usage: "primary 上のテキスト", contrast_label: "14.85:1 AAA on primary" }
        - { name: "focus-ring", hex: "#1B1B1B", oklch: { l: 0.22, c: 0, h: 0 }, usage: "キーボードフォーカス枠線", contrast_label: "17.22:1 AAA on surface" }
        - { name: "border", hex: "#8F8F8F", oklch: { l: 0.65, c: 0, h: 0 }, usage: "要素境界", contrast_label: "3.23:1 AA on surface" }
      state_colors:
        error:
          bg: { hex: "#FFE3E5", oklch: { l: 0.94, c: 0.12, h: 15 }, contrast_label: "エラー背景" }
          text: { hex: "#460011", oklch: { l: 0.25, c: 0.18, h: 15 }, contrast_label: "5.8:1 AAA on error.bg" }
          border: { hex: "#D64455", oklch: { l: 0.50, c: 0.18, h: 15 }, contrast_label: "3.6:1 AA on error.bg" }
